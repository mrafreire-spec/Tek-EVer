<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>UAS Academy — Learning</title><style>:root{color-scheme:light;--ink:#182c37;--muted:#647783;--accent:#126b68;--accent2:#0d514f;--line:#e1e8e7;--paper:#fff;--bg:#f5f8f7;--nav:#173b3c}*{box-sizing:border-box}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #70c3b6;outline-offset:3px}button:disabled{cursor:default;opacity:.55}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}.side{background:white;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 8px;margin-bottom:45px}.mark{width:40px;height:40px;background:var(--accent);border-radius:12px;display:grid;place-items:center;color:white;font-size:22px;font-weight:800;letter-spacing:-2px}.brand strong{display:block;font-size:15px;letter-spacing:-.3px}.brand small{font-size:11px;color:var(--muted)}.navlabel{font-size:10px;letter-spacing:1.5px;font-weight:750;color:#81918f;padding:0 11px 8px}nav{display:grid;gap:4px}nav button,.admin{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:9px;color:#536970;font-weight:550;font-size:14px}nav button.active{background:#e5f2ef;color:#105e59;font-weight:700}nav button:hover,.admin:hover{background:#f0f5f3}.ico{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.sidebottom small{display:block;margin:16px 10px 0;color:#85938f;font-size:11px}.top{height:73px;padding:0 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:white}.crumb{font-size:13px;font-weight:600;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{display:grid;place-items:center;border-radius:50%;background:#e2f0eb;color:#24635c;width:35px;height:35px;font-weight:800;font-size:12px}.profile small{display:block;color:var(--muted);font-size:11px}.wrap{max-width:1220px;margin:auto;padding:36px 40px 60px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:clamp(29px,3.2vw,42px);line-height:1.12;letter-spacing:-1.6px;font-weight:730}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:16px;letter-spacing:-.25px}.sub{color:var(--muted);margin-top:8px;font-size:14px}.intro{margin-bottom:25px}.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(160px,.7fr);overflow:hidden;position:relative;border-radius:19px;background:linear-gradient(116deg,#123f42,#176763);color:white;padding:31px 34px;gap:12px;align-items:center;min-height:248px}.hero .eyebrow{color:#a7d8cb}.hero h2{font-size:clamp(26px,3vw,38px);line-height:1.12;letter-spacing:-1.2px;margin:12px 0}.hero p{color:#c4e2db;max-width:460px;font-size:14px}.hero .btn{margin-top:21px;background:#fff;color:#164f4d;border-color:#fff}.hero-art{width:100%;max-height:206px;opacity:.94}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:white;border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-weight:650;font-size:14px;text-decoration:none;min-height:42px}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;color:var(--accent);border-color:#cedfd9}.btn.ghost{background:transparent;color:var(--accent);border-color:transparent}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{margin-top:30px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:19px}.stat .num{font-size:28px;letter-spacing:-1px;line-height:1.2;font-weight:750;margin:9px 0 4px}.small{font-size:12px;color:var(--muted)}.bar{height:7px;background:#e7efeb;border-radius:10px;overflow:hidden;margin:10px 0}.bar>i{height:100%;display:block;background:#2c8a78;border-radius:10px;transition:width .2s}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.module{display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink);cursor:pointer;min-height:155px}.module:hover{border-color:#8bbdb1;box-shadow:0 5px 20px #214e4310}.module .modicon{width:36px;height:36px;border-radius:10px;background:#edf5f1;color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:750}.module h3{line-height:1.3}.module .bar{margin:0}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf3f0;color:#41685c;font-size:11px;font-weight:650}.pill.warn{color:#8a6228;background:#fbf2dd}.pill.neutral{color:#687a7b;background:#eff2f3}.banner{display:flex;gap:13px;align-items:flex-start;background:#edf5f2;border-radius:11px;padding:14px 16px;margin-top:18px;color:#365c56;font-size:13px}.split{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}.lesson-side{position:sticky;top:15px}.list{display:grid;gap:5px}.list button{display:flex;align-items:flex-start;text-align:left;gap:9px;border:1px solid transparent;background:none;color:var(--ink);padding:10px;border-radius:8px;font-size:13px}.list button.current{background:#eaf4f0;color:var(--accent);border-color:#d5e7e0;font-weight:650}.list button:hover{background:#f1f5f4}.lesson-body{padding:28px;min-height:350px}.lesson-body h1{font-size:30px;margin:10px 0 18px}.reading{font-size:17px;line-height:1.85;color:#364b54;margin:20px 0 28px;white-space:pre-line}.objective{background:#f1f6f3;border-left:3px solid #589e8a;padding:15px;margin:18px 0;border-radius:0 8px 8px 0;font-size:14px}.foot{border-top:1px solid var(--line);padding-top:17px;margin-top:25px}.quiz{max-width:780px;margin:auto}.choice{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;margin:9px 0;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:15px}.choice:hover{border-color:#7cae9f}.choice.selected{background:#eaf5ef;border-color:var(--accent)}.choice.correct{background:#e3f5e7;border-color:#62a276}.choice.incorrect{background:#fdf0ed;border-color:#d59b91}.letter{display:grid;place-items:center;min-width:30px;height:30px;border-radius:7px;background:#f0f4f2;font-weight:650;color:#52665e}.question{font-size:23px;line-height:1.45;margin:18px 0}.result-score{font-size:52px;letter-spacing:-2px;font-weight:750;color:var(--accent)}.review{margin-top:8px;padding:11px 0;border-bottom:1px solid var(--line)}.objective-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 110px;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.objective-row:last-child{border-bottom:0}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;padding:13px 15px;border:1px solid #cddbd6;border-radius:9px;background:white;color:var(--ink)}.source{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fafcfb}.source p{margin-top:8px;line-height:1.7}.disclaimer{margin-top:32px;font-size:11px;color:#748581;line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:194px minmax(0,1fr)}.wrap{padding:28px 26px}.top{padding:0 26px}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.lesson-side{position:static}.hero{padding:25px}}@media(max-width:680px){.shell{display:block}.side{height:auto;position:sticky;top:0;z-index:10;padding:10px 12px;border-bottom:1px solid var(--line);border-right:0}.brand{margin:0 0 8px;padding:0 4px}.mark{width:30px;height:30px;border-radius:8px;font-size:17px}.brand small,.navlabel,.sidebottom small{display:none}.sidebottom{position:absolute;right:12px;top:8px;border:0;padding:0;margin:0}.admin{font-size:11px;padding:7px}.admin .ico{display:none}nav{display:flex;overflow:auto;gap:2px}nav button{flex:1;white-space:nowrap;font-size:11px;padding:8px 5px;justify-content:center;gap:5px}nav .ico{width:15px;height:15px}.top{height:48px;padding:0 16px}.profile small{display:none}.avatar{width:26px;height:26px}.wrap{padding:22px 16px 35px}.hero{grid-template-columns:1fr;padding:24px;min-height:210px}.hero-art{display:none}.grid{gap:8px}.stat{padding:12px}.stat .num{font-size:23px}.stat .small{font-size:10px}.module-grid{gap:9px}.module{padding:14px;min-height:145px}.module h3{font-size:14px}.lesson-body{padding:19px}.lesson-body h1{font-size:25px}.reading{font-size:16px}.objective-row{grid-template-columns:minmax(0,1fr) 92px;font-size:12px}.objective-row .bar{display:none}.search{flex-wrap:wrap}.search input{width:100%;flex-basis:100%}.section h2{font-size:18px}.card{border-radius:11px}.hero h2{font-size:30px}.question{font-size:20px}.btn{font-size:13px}.crumb{font-size:11px}}</style></head><body><div class="shell"><aside class="side"><a class="brand" href="/"><span class="mark">A</span><span><strong>UAS Academy</strong><small>Learning & development</small></span></a><div class="navlabel">LEARN</div><nav aria-label="Learning navigation"></nav><div class="sidebottom"><a class="admin" href="/admin.html">↗ &nbsp; Staff workspace</a><small>Independent concept · v0.8<br>Demonstration only</small></div></aside><div><header class="top"><span class="crumb">Learning dashboard</span><div class="profile"><span class="avatar">DL</span><span><strong>Demo learner</strong><small>Student workspace</small></span></div></header><main class="wrap"></main></div></div><template id="hero-art"><svg class="hero-art" viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="none" stroke="#a8d8c9" opacity=".23"><circle cx="150" cy="106" r="95"/><circle cx="150" cy="106" r="72"/><circle cx="150" cy="106" r="49"/><path d="M10 106h280M150 8v196M36 34l228 144M36 178L264 34"/></g><g transform="translate(150 105) rotate(-13)" stroke="#d9f3e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#e3f2e9"><path d="M-9 -14L-53 -52M9 -14L53 -52M-9 14L-53 52M9 14L53 52" fill="none"/><g stroke-width="2" fill="#b8e3d3" fill-opacity=".22"><circle cx="-57" cy="-56" r="29"/><circle cx="57" cy="-56" r="29"/><circle cx="-57" cy="56" r="29"/><circle cx="57" cy="56" r="29"/></g><g stroke-width="3"><path d="M-79 -56h44M35 -56h44M-79 56h44M35 56h44"/><path d="M-57 -78v44M57 -78v44M-57 34v44M57 34v44"/></g><rect x="-18" y="-32" width="36" height="64" rx="17"/><rect x="-8" y="-15" width="16" height="25" rx="5" fill="#176763" stroke="none"/></g><g fill="#b8e3d3" font-family="system-ui" font-size="9" letter-spacing="1"><text x="12" y="16">CIVIL UAS / TRAINING</text><text x="190" y="202">A1 / A3</text></g></svg></template><script type="application/json" id="data">{"course":{"id":"UAS-EU-OPEN-001","version":"0.1.0","title":"Basic Remote Pilot — A1/A3","status":"DRAFT / PREPARATORY ONLY","language":"en","minutes":480,"passMark":75,"examQuestions":40,"modules":[{"id":"UAS-010","title":"Aviation Regulations","minutes":75,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (c)","lessons":[{"id":"UAS-010-01","title":"Regulatory structure","objective":"Distinguish EU rules, national implementation and EASA guidance.","content":"Regulation 2019/947 governs UAS operations and pilot competence; 2019/945 governs product requirements and classes. EASA publishes AMC and GM. National authorities implement rules and publish local constraints. Check the current legal text before relying on training material."},{"id":"UAS-010-02","title":"Open category and classes","objective":"Differentiate A1, A2 and A3 and identify applicable aircraft class and pilot competence.","content":"Open operations are low risk and subject to conditions including visual line of sight, height limits and restrictions on people. A1, A2 and A3 have different limitations. Class marking, mass and intended operation determine the applicable conditions. A1/A3 training is not a blanket permission to fly any drone anywhere."},{"id":"UAS-010-03","title":"Responsibilities and reporting","objective":"Distinguish operator and remote pilot responsibilities, registration and reporting.","content":"The operator manages compliance and registration where required. The remote pilot must be competent for the intended operation and comply with relevant limitations. Establish which occurrence reporting obligations apply; record and report safety events through the appropriate channels."}]},{"id":"UAS-020","title":"Air Safety","minutes":60,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (a)","lessons":[{"id":"UAS-020-01","title":"Safety decisions","objective":"Recognise unsafe conditions, unsafe conduct and the need to stop.","content":"The pilot should consider the aircraft, environment and personal readiness before operating. If safety cannot be maintained, do not start or discontinue the operation safely. Do not transport dangerous goods under the Open category."},{"id":"UAS-020-02","title":"People and other aircraft","objective":"Recognise uninvolved people, assemblies, and the duty to avoid collision.","content":"Keep the operation within applicable limits around people and property. Open operations must not fly over assemblies of people. Give way to other aircraft; do not continue if the operation creates a risk to other airspace users."},{"id":"UAS-020-03","title":"Visual observation","objective":"Explain VLOS, observation and awareness of the surrounding area.","content":"Visual line of sight requires continuous unaided visual contact sufficient to control the aircraft relative to people, obstacles and other aircraft. An observer may assist under applicable conditions, but the remote pilot remains responsible. Explain relevant risks to involved participants."}]},{"id":"UAS-030","title":"Airspace Restrictions","minutes":45,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (b)","lessons":[{"id":"UAS-030-01","title":"Geographical zones","objective":"Identify the purpose of UAS geographical zones and their conditions.","content":"Member States may restrict, prohibit or facilitate UAS operations in defined areas. A zone may specify additional conditions or an authorization requirement. An Open category proof of completion does not remove local airspace restrictions."},{"id":"UAS-030-02","title":"Authoritative information","objective":"Locate current information from national authorities and distinguish it from informal maps.","content":"Use the official national source for current geographical zones and applicable restrictions. Check the validity and time of information; an old screenshot or commercial map alone may not be sufficient."},{"id":"UAS-030-03","title":"Geo-awareness","objective":"Explain the limitations of geo-awareness functions.","content":"Geo-awareness may alert a pilot to geographical restrictions based on loaded data. Data may be incomplete or outdated. It is an aid to awareness, not an authorization or substitute for current official information."}]},{"id":"UAS-040","title":"Human Performance Limitations","minutes":45,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (d)","lessons":[{"id":"UAS-040-01","title":"Fitness to operate","objective":"Recognise effects of fatigue, illness, substances and medication.","content":"Fatigue, alcohol, illness and certain medicines may impair attention, reaction time and judgement. Do not operate when unfit. Seek appropriate medical advice where necessary."},{"id":"UAS-040-02","title":"Perception and workload","objective":"Recognise limits in distance, height, speed and orientation estimation.","content":"Small aircraft can be difficult to see, and visual cues vary with lighting, contrast and distance. High workload can reduce the ability to detect hazards. Keep tasks manageable and avoid distractions."},{"id":"UAS-040-03","title":"Situational awareness","objective":"Explain how environmental conditions affect awareness, including at night.","content":"Maintain an accurate understanding of the aircraft, environment and other airspace users. Reduced lighting and glare can make hazards harder to perceive. Apply applicable night-operation conditions and stop if safe awareness cannot be maintained."}]},{"id":"UAS-050","title":"Operational Procedures","minutes":90,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (e)","lessons":[{"id":"UAS-050-01","title":"Pre-operation planning","objective":"Identify the need to assess weather, site, equipment and persons before a civilian flight.","content":"Review applicable restrictions, weather and the manufacturer instructions before deciding whether the intended civilian operation is safe. Consider obstacles, uninvolved people, equipment condition and the suitability of the area."},{"id":"UAS-050-02","title":"Normal and abnormal situations","objective":"Distinguish normal, contingency and emergency procedures in approved instructions.","content":"The manufacturer instructions and applicable operator procedures define how to manage abnormal events. Understand when the operation must be discontinued and when to seek help. Prioritise safety of people and other aircraft over completing the task."},{"id":"UAS-050-03","title":"Post-operation records","objective":"Explain the purpose of defect reporting, maintenance and flight records.","content":"Record relevant activity and defects as required. Do not return defective equipment to service without appropriate action. Follow the applicable maintenance and occurrence reporting requirements."}]},{"id":"UAS-060","title":"UAS General Knowledge","minutes":75,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (f)","lessons":[{"id":"UAS-060-01","title":"Aircraft and basic flight","objective":"Identify major aircraft components and factors affecting flight.","content":"A UAS includes the unmanned aircraft and the equipment needed to control it remotely. Aircraft designs differ. Mass, wind, temperature and energy reserves can affect performance. Use the manufacturer limitations for the specific civilian aircraft."},{"id":"UAS-060-02","title":"Control and automation","objective":"Explain the role and limitations of command and control and automatic functions.","content":"A command-and-control link supports communication between the remote pilot station and aircraft. Automation does not remove pilot responsibility. Familiarisation with the user manual is necessary to understand limitations, alerts and safe use."},{"id":"UAS-060-03","title":"Equipment care","objective":"Recognise battery, rotor and maintenance hazards and the purpose of technical features.","content":"Rotating parts and damaged batteries can cause injury. Follow manufacturer guidance on handling, charging, storage and maintenance. Remote identification and geo-awareness have distinct purposes; neither replaces regulatory compliance."}]},{"id":"UAS-070","title":"Privacy and Data Protection","minutes":30,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (g)","lessons":[{"id":"UAS-070-01","title":"Privacy risks","objective":"Recognise when images or other data can affect personal privacy.","content":"Drone sensors can capture identifiable people, locations and other sensitive information. Consider whether collection is necessary and lawful; avoid unnecessary collection."},{"id":"UAS-070-02","title":"Data protection principles","objective":"Identify core GDPR principles and distinguish them from aviation authorization.","content":"Where GDPR applies, personal data processing must have a lawful basis and comply with purpose limitation, minimisation, accuracy, retention and security principles. Permission to fly is not automatically permission to collect personal data."},{"id":"UAS-070-03","title":"Responsible records","objective":"Explain access, retention and disclosure responsibilities.","content":"Restrict access to personal information and retain it only as justified. Follow organisational procedures and applicable law for disclosure, deletion and rights requests."}]},{"id":"UAS-080","title":"Insurance","minutes":30,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (h)","lessons":[{"id":"UAS-080-01","title":"Liability","objective":"Explain the difference between legal liability and insurance.","content":"An operator may be liable for damage arising from an operation. Insurance may cover specified risks, subject to policy terms. Liability does not disappear simply because an aircraft is insured."},{"id":"UAS-080-02","title":"Applicable requirements","objective":"Recognise EU and national insurance requirements may vary.","content":"Insurance requirements depend on the operation, applicable legislation and jurisdiction. Confirm current requirements with the relevant authority or qualified insurer rather than assuming the same rules apply everywhere."},{"id":"UAS-080-03","title":"Coverage verification","objective":"Identify why coverage and exclusions need review.","content":"Before operation, verify that any required insurance is valid and appropriate for the intended activity. Check policy dates, scope and exclusions. Keep evidence where required."}]},{"id":"UAS-090","title":"Security","minutes":30,"reference":"AMC1 UAS.OPEN.020(4)(b) and UAS.OPEN.040(3), subject (i)","lessons":[{"id":"UAS-090-01","title":"Safety and security","objective":"Distinguish accidental safety hazards from deliberate interference or misuse.","content":"Safety focuses on accidental harm; security addresses intentional threats and misuse. Both can overlap. Report security concerns through authorised channels and follow applicable procedures."},{"id":"UAS-090-02","title":"Information protection","objective":"Recognise the need to protect accounts, records and equipment access.","content":"Use authorised accounts, protect credentials, limit access to those with a legitimate need and report suspected compromise. Do not upload protected information to unapproved services."},{"id":"UAS-090-03","title":"National requirements","objective":"Recognise that security restrictions can differ between jurisdictions.","content":"National security rules may impose additional conditions on civilian UAS activities, including access to certain areas or data. Verify local requirements and obtain any necessary permissions before operating."}]}],"questions":[{"id":"Q-010-01","objective":"UAS-010-01","prompt":"Which EU regulation primarily governs UAS operations?","options":["2019/947","2019/945 only","GDPR only","Annex 19 only"],"correct":0,"explanation":"2019/947. Review Regulatory structure."},{"id":"Q-010-02","objective":"UAS-010-01","prompt":"What does 2019/945 principally address?","options":["UAS product requirements and classes","Personal data retention","All national maps","Pilot medical certificates"],"correct":0,"explanation":"UAS product requirements and classes. Review Regulatory structure."},{"id":"Q-010-03","objective":"UAS-010-02","prompt":"Does A1/A3 proof authorize every Open operation?","options":["No, applicable aircraft and operational conditions still apply","Yes, without limitation","Yes, in every geographical zone","Only if insured"],"correct":0,"explanation":"No, applicable aircraft and operational conditions still apply. Review Open category and classes."},{"id":"Q-010-04","objective":"UAS-010-03","prompt":"Who must comply with the operational limitations during a flight?","options":["The remote pilot","Only the manufacturer","Only an insurer","Only the authority"],"correct":0,"explanation":"The remote pilot. Review Responsibilities and reporting."},{"id":"Q-010-05","objective":"UAS-010-03","prompt":"What should an operator do about applicable occurrence reporting?","options":["Use the required reporting channels","Delete all records","Wait for a customer request","Report only equipment purchases"],"correct":0,"explanation":"Use the required reporting channels. Review Responsibilities and reporting."},{"id":"Q-010-06","objective":"UAS-010-01","prompt":"Which document provides acceptable means of compliance and guidance?","options":["EASA AMC and GM","An insurance receipt","A sales brochure","A social media post"],"correct":0,"explanation":"EASA AMC and GM. Review Regulatory structure."},{"id":"Q-020-01","objective":"UAS-020-01","prompt":"What if safety cannot be maintained before a flight?","options":["Do not commence","Continue to meet the schedule","Rely solely on automation","Ignore the concern"],"correct":0,"explanation":"Do not commence. Review Safety decisions."},{"id":"Q-020-02","objective":"UAS-020-02","prompt":"May Open category operations fly over assemblies of people?","options":["No","Always","Only with a camera","Always below the height limit"],"correct":0,"explanation":"No. Review People and other aircraft."},{"id":"Q-020-03","objective":"UAS-020-02","prompt":"Who has priority when other aircraft create a conflict?","options":["Other aircraft must be given way to","The drone always","The smallest aircraft always","The aircraft recording video"],"correct":0,"explanation":"Other aircraft must be given way to. Review People and other aircraft."},{"id":"Q-020-04","objective":"UAS-020-03","prompt":"What does VLOS require?","options":["Adequate continuous unaided visual contact","Only a live video feed","A flight log after landing","A GPS map alone"],"correct":0,"explanation":"Adequate continuous unaided visual contact. Review Visual observation."},{"id":"Q-020-05","objective":"UAS-020-03","prompt":"Does an observer remove the remote pilot’s responsibilities?","options":["No","Yes, entirely","Only on weekends","Only with insurance"],"correct":0,"explanation":"No. Review Visual observation."},{"id":"Q-030-01","objective":"UAS-030-01","prompt":"What can a geographical zone impose?","options":["Additional restrictions or conditions","Automatic worldwide permission","A replacement pilot licence","An insurance refund"],"correct":0,"explanation":"Additional restrictions or conditions. Review Geographical zones."},{"id":"Q-030-02","objective":"UAS-030-02","prompt":"Which source should be checked for current restrictions?","options":["The official national source","An old screenshot","A forum comment","A manufacturer advertisement"],"correct":0,"explanation":"The official national source. Review Authoritative information."},{"id":"Q-030-03","objective":"UAS-030-03","prompt":"Does a geo-awareness alert grant authorization?","options":["No","Yes","Only if the battery is full","Only for A3"],"correct":0,"explanation":"No. Review Geo-awareness."},{"id":"Q-030-04","objective":"UAS-030-01","prompt":"Can a valid A1/A3 proof override a prohibited zone?","options":["No","Yes","Only if the pilot is experienced","Only if flying slowly"],"correct":0,"explanation":"No. Review Geographical zones."},{"id":"Q-040-01","objective":"UAS-040-01","prompt":"How can fatigue affect performance?","options":["It can impair attention and judgement","It improves vision","It eliminates workload","It guarantees accuracy"],"correct":0,"explanation":"It can impair attention and judgement. Review Fitness to operate."},{"id":"Q-040-02","objective":"UAS-040-01","prompt":"What should an unfit pilot do?","options":["Not operate","Fly faster","Rely on the camera alone","Ignore the symptoms"],"correct":0,"explanation":"Not operate. Review Fitness to operate."},{"id":"Q-040-03","objective":"UAS-0
